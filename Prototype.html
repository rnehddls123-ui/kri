<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>도쿄 트래블 엔진</title>
<link rel="stylesheet" href="ds/colors_and_type.css" />
<link rel="stylesheet" href="app.css" />
<style>
  html, body { margin: 0; height: 100%; background: #161618; }
  body { display: flex; justify-content: center; }
  #root {
    width: 390px;
    max-width: 100%;
    height: 100vh;
    height: 100dvh;
    position: relative;
  }
</style>
</head>
<body>

<div id="root"></div>

<script>
  // ── API key store ─────────────────────────────────────────────
  window.__apiKeys = {
    gemini: localStorage.getItem('kri_gemini_key') || '',
    maps:   localStorage.getItem('kri_maps_key')   || '',
  };

  // ── Google Maps JS API loader ─────────────────────────────────
  function loadGoogleMapsAPI(key) {
    if (window.google && window.google.maps) { window.__mapsReady = true; return; }
    if (window.__mapsLoading) return;
    window.__mapsLoading = true;
    window.__mapsInitCallback = function() { window.__mapsReady = true; };
    var s = document.createElement('script');
    s.src = 'https://maps.googleapis.com/maps/api/js?key=' + key
          + '&callback=__mapsInitCallback&v=weekly&libraries=places';
    s.async = true;
    s.onerror = function() { console.warn('Google Maps failed to load'); window.__mapsLoading = false; };
    document.head.appendChild(s);
  }
  if (window.__apiKeys.maps) loadGoogleMapsAPI(window.__apiKeys.maps);

  // ── Called by landing.jsx API settings screen ─────────────────
  window.__saveApiKeys = function(gemini, maps) {
    window.__apiKeys.gemini = gemini;
    window.__apiKeys.maps   = maps;
    if (gemini) localStorage.setItem('kri_gemini_key', gemini);
    else        localStorage.removeItem('kri_gemini_key');
    if (maps) {
      localStorage.setItem('kri_maps_key', maps);
      if (!window.__mapsLoading) loadGoogleMapsAPI(maps);
    } else {
      localStorage.removeItem('kri_maps_key');
    }
  };
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
